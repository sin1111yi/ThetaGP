# The board's own declaration, as data: every field a BoardConfig.toml
# may carry, the values it is accepted under, and what it becomes.
#
# Read by scripts/config/schema.py, which is the only reader, and written
# by schema_dump.py, which is the only writer: the two are each other's
# inverse, and the golden headers under scripts/test/board_config/ are
# what says so — the generator's output is unchanged only when every row
# of this file came back whole.
#
# `path` is where a table sits in the declaration: one segment is a table,
# several are tables inside tables. A row of `items` is a field, or a
# group of them that applies to the table only in one state.

[[table]]
path = ["board_info"]

[[table.item]]
item = "field"
name = "identifier"
kind = "Word"
required = true
cmake = "BOARD_IDENTIFIER"

[[table.item]]
item = "field"
name = "name"
kind = "Text"
required = true
cmake = "BOARD_NAME"

[[table.item]]
item = "field"
name = "mcu"
kind = "Text"
required = true
cmake = "BOARD_MCU"

[[table.item]]
item = "field"
name = "mcu_series"
kind = "Enum"
table = "MCU_HEADER_MAP"
required = true
cmake = "BOARD_MCU_SERIES"
include = true

[[table.item]]
item = "field"
name = "chip"
kind = "Text"
required = true
cmake = "BOARD_CHIP"

[[table]]
path = ["led"]
kind = "map"
what = "LED"

[[table.preamble]]
kind = "Presence"
macro = "BDCFG_HAS_RGB_STRIP"
sub = "rgb_strip"

[[table.item]]
item = "group"
when = ["source", "present"]

  [[table.item.field]]
  name = "pin"
  kind = "Pin"
  required = true
  macro = "BDCFG_LED_{NAME}_PIN"

  [[table.item.field]]
  name = "source"
  kind = "Enum"
  table = "LED_TIMER_CHANNEL_MAP"
  required = true
  macro = "BDCFG_LED_{NAME}_SOURCE"

  [[table.item.field]]
  name = "number"
  kind = "Int"
  required = true
  macro = "BDCFG_LED_{NAME}_NUMBER"
  low = 1
  high = 64

[[table.item]]
item = "group"
when = ["source", "absent"]

  [[table.item.field]]
  name = "pin"
  kind = "Pin"
  required = true
  macro = "BDCFG_LED_{NAME}_PIN"

  [[table.item.field]]
  name = "active_low"
  kind = "Bool"
  macro = "BDCFG_LED_{NAME}_ACTIVE_LOW"

[[table]]
path = ["keypad"]
required = true

[[table.item]]
item = "field"
name = "drive_mode"
kind = "Enum"
table = "KEYPAD_DRIVE_MODE_MAP"
required = true
macro = "BDCFG_KEYPAD_DRIVE_MODE"
prefix = "KeypadConfig::Mode::"
lower = true

[[table.item]]
item = "field"
name = "active_mode"
kind = "Enum"
table = "KEYPAD_ACTIVE_MODE_MAP"
macro = "BDCFG_KEYPAD_ACTIVE_MODE"
default = "none"
prefix = "KeypadConfig::Active::"
lower = true

[[table.item]]
item = "group"
when = ["drive_mode", "scan_matrix"]
note = "for scan_matrix"

  [[table.item.field]]
  name = "drive_pins"
  kind = "PinArray"
  required = true
  count_macro = "BDCFG_KEYPAD_DRIVE_PIN_NUM"
  list_macro = "BDCFG_KEYPAD_DRIVE_IO_LIST"

  [[table.item.field]]
  name = "sense_pins"
  kind = "PinArray"
  required = true
  count_macro = "BDCFG_KEYPAD_SENSE_PIN_NUM"
  list_macro = "BDCFG_KEYPAD_SENSE_IO_LIST"

  [[table.item.field]]
  name = "key_map"
  kind = "Matrix"
  drive = "drive_pins"
  sense = "sense_pins"
  macro = "BDCFG_KEYPAD_KEY_MAP"
  index_macro = "BDCFG_KEYPAD_MAX_KEY_INDEX"
  mask_macro = "BDCFG_KEYPAD_MASK_ARRAY_SIZE"

[[table.item]]
item = "group"
when = ["drive_mode", "io_direct"]
note = "for io_direct"

  [[table.item.field]]
  name = "direct_pins"
  kind = "PinArray"
  required = true
  count_macro = "BDCFG_KEYPAD_DIRECT_PINS_NUM"
  list_macro = "BDCFG_KEYPAD_DIRECT_PINS"

[[table.item]]
item = "group"
when = ["drive_mode", "spi_74hc165"]
note = "for spi_74hc165"

  [[table.item.field]]
  name = "spi_chips"
  kind = "Int"
  required = true
  macro = "BDCFG_KEYPAD_SPI_CHIPS"
  low = 1
  high = 4

[[table.item]]
item = "field"
name = "button_map"
kind = "PairList"
line = "BDCFG_KEYPAD_BUTTON_MAP"
prefix = "GAMEPAD_MASK_"

[[table]]
path = ["usb"]

[[table.item]]
item = "field"
name = "hw_periph"
kind = "Flag"
table = "USB_PERIPHERAL_MAP"
prefix = "BDCFG_IF_"

[[table.item]]
item = "field"
name = "speed"
kind = "Flag"
table = "USB_SPEED_MAP"
prefix = "BDCFG_SPEED_"

[[table.item]]
item = "field"
name = "wired_report_hz"
kind = "Rate"
macro = "BDCFG_REPORT_RATE_HZ"

[[table]]
path = ["bus", "uart"]
kind = "array"

[table.lines]
factory = "bus_lines"
kind = "UART"
template = "{{peripheral}, {tx}, {rx}, {baud}}"
defaults = { rx = "@tx", baud = 115200 }

[[table.item]]
item = "field"
name = "bind"
kind = "Text"

[[table.item]]
item = "field"
name = "peripheral"
kind = "Enum"
table = "UART_PERIPHERAL_ENUM_MAP"
required = true

[[table.item]]
item = "field"
name = "tx"
kind = "Pin"
required = true

[[table.item]]
item = "field"
name = "rx"
kind = "Pin"

[[table.item]]
item = "field"
name = "baud"
kind = "Int"
low = 1

[[table]]
path = ["bus", "spi"]
kind = "array"

[table.lines]
factory = "bus_lines"
kind = "SPI"
template = "{{peripheral}, {{sclk}, {mosi}, {miso}}, {ncs}}"
defaults = {  }

[[table.item]]
item = "field"
name = "bind"
kind = "Text"

[[table.item]]
item = "field"
name = "peripheral"
kind = "Enum"
table = "SPI_PERIPHERAL_ENUM_MAP"
required = true

[[table.item]]
item = "field"
name = "sclk"
kind = "Pin"
required = true

[[table.item]]
item = "field"
name = "mosi"
kind = "Pin"
required = true

[[table.item]]
item = "field"
name = "miso"
kind = "Pin"
required = true

[[table.item]]
item = "field"
name = "ncs"
kind = "Pin"
required = true

[[table]]
path = ["flash"]
reports = "check_flash"
lines = "lines_flash"

[[table.item]]
item = "field"
name = "chip"
kind = "Enum"
table = "VALID_FLASH_CHIPS"
