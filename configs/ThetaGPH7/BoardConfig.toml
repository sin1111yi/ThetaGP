[board_info]
identifier     = "ThetaGPH7"
name           = "ThetaGP-H743_Ver.Ultra"
mcu            = "STM32H743xx"
mcu_series     = "STM32H7"
chip           = "STM32H743VI"

[led.run0]
pin        = "PD8"
active_low = false

[keypad]
drive_mode  = "scan_matrix"
active_mode = "none"

drive_pins = ["PD8", "PD9"]
sense_pins = ["PC4", "PC5"]

key_map = [
    [0, 1],
    [2, 3],
]

button_map = [
    [0, "B1"],
    [1, "B2"],
    [2, "B3"],
    [3, "B4"],
]

[usb]
hw_periph       = "ULPI"
speed           = "high_speed"
wired_report_hz = 8000

# The PHY's twelve lines, in the order the ULPI port drives them:
# CLK, STP, DIR, NXT, D0..D7.
ulpi_pins = [
    "PA5", "PC0", "PC2", "PC3",
    "PA3", "PB0", "PB1", "PB10",
    "PB11", "PB12", "PB13", "PB5",
]

[[bus.uart]]
bind       = "logger"
peripheral = "UART1"
tx         = "PB14"
rx         = "PB15"

[flash]
chip = "none"
