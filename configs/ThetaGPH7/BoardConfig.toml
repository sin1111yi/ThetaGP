[board_info]
identifier     = "ThetaGPH7"
name           = "ThetaGP-H743_Ver.Ultra"
mcu            = "STM32H743xx"
mcu_series     = "STM32H7"
chip           = "STM32H743VI"

[led.run0]
pin        = "PD8"
active_low = false

[keypad]
drive_mode  = "scan_matrix"
active_mode = "none"

drive_pins = ["PD8", "PD9"]
sense_pins = ["PC4", "PC5"]

key_map = [
    [0, 1],
    [2, 3],
]

button_map = [
    [0, "B1"],
    [1, "B2"],
    [2, "B3"],
    [3, "B4"],
]

[usb]
hw_periph       = "ULPI"
speed           = "high_speed"
wired_report_hz = 8000

# The twelve lines the PHY is wired with, each by the name the port drives it
# by: the clock, the three handshakes, then the eight data bits.
[usb.ulpi]
clk = "PA5"
stp = "PC0"
dir = "PC2"
nxt = "PC3"
d0  = "PA3"
d1  = "PB0"
d2  = "PB1"
d3  = "PB10"
d4  = "PB11"
d5  = "PB12"
d6  = "PB13"
d7  = "PB5"

[[bus.uart]]
bind       = "logger"
peripheral = "UART1"
tx         = "PB14"
rx         = "PB15"

[flash]
chip = "none"
