# Config key schema — the one name of every field the config system carries.
#
# One field, one name. The name is the whole identity: the protocol key
# (config.get_key / config.set_key / config.list_keys) and the path a profile
# body carries for that field are this same string, and the C++ side of the
# field is its last segment. Nothing else spells a field name.
#
# The protocol spec does not carry these rows: a row names the consumer's field
# and the spec may not know the consumer (protocol/README.md, design
# principles). This is the config domain's own source; the header the firmware
# compiles is generated from it.
#
# The order of the rows is the order config.list_keys reports them in.
#
# name      <domain>.<leaf>, leaf = the field's C++ name
# type      u8 | u16 | i16 | bool | u8_array
# count     element count, arrays only
# min/max   accepted range, both inclusive
# default   the value a factory profile starts from, or "board" for a field the
#           board's own configuration supplies. The firmware's copies of these
#           numbers (conf/ThetaGP_Config.h) are where they live today and are
#           moving here; until they do, the two are held equal by hand.
# exposed   true when config.* accepts this key
# flags     reboot (reaches the field only at the next boot)
#           accepts_unmapped (255 is an element a caller may set back)

[[field]]
name = "map.socd"
type = "u8"
min = 0
max = 4
default = 4
exposed = true
doc = "SOCD cleaning mode (0 UpPriority, 1 Neutral, 2 SecondInput, 3 FirstInput, 4 Bypass)"

[[field]]
name = "map.four_way"
type = "bool"
min = 0
max = 1
default = 0
exposed = true
doc = "Four-way mode: of two opposing directions only the most recent one is kept"

[[field]]
name = "map.btn_map"
type = "u8_array"
count = 32
min = 0
max = 31
default = "board"
exposed = true
flags = ["accepts_unmapped"]
doc = "Physical key to button bit index (255 = a key with no button)"

