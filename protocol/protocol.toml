# =============================================================================
# ThetaGP CDC JSON Protocol Definition
# =============================================================================
# This file is the SINGLE SOURCE OF TRUTH for all CDC JSON protocol types,
# commands, constants, and error codes. The Python code generator
# (scripts/gen_proto.py) reads this file and produces:
#   - C++   header  — device side
#   - Rust  module  — Tauri backend
#   - TS    types   — frontend
#
# Format overview:
#   [meta]            — project metadata
#   [[types]]         — shared data structures (structs)
#   [[enums]]         — enumeration types
#   [[commands]]      — per-command definitions
#   [error_codes]     — global error codes
#   [domains]         — domain prefix registry
#   [envelope]        — response envelope (the keys a reply and a request
#                       carry, and how completely each side carries them)
#   [error_reply]     — error reply (the keys an error reply carries behind the
#                       envelope, and in which messages they appear)
#   [[async_messages]] — device-initiated async message definitions
#
# A field of a command may carry a `role`, a property of the field that outlives
# its type and its position. The generator turns each role into an expectation
# the consumers of this file hold:
#   accounting    — the field is part of the per-task accounting subset the CDC
#                   test suite requires in every build
#                   (scripts/test/test_cdc_protocol.py)
#   task_counters — the field is written to a response only in a build that
#                   compiles the task counters in (USE_TASK_COUNTERS)
#
# A *response* field may carry `optional = true`: the field is declared, and
# every emitter still writes it (the response table, the bindings, the
# manifest), but a reply of that command may leave the key out — so a consumer
# reads its absence as normal and not as a reply that lost a field. An absent
# column means the field is in every reply, which is what every declared
# response field was held to before the column existed, so a command that
# declares nothing leaves its replies exactly as they were. What the column does
# not say is *when* the key is left out: that is the firmware's rule for the
# field, and it is written where the field is, in prose, because the generator
# has nothing to derive it from.
#
# The two sides carry their optionality in different columns, and neither column
# means the same on the other side: on the request side the absent column means
# optional (`required = false` is what says required on a request field, and the
# bindings default an unflagged key) while on the response side the absent
# column means required. Reusing `required` for a response field would have given
# one column two opposite defaults depending on which side it sat on, so the
# response side has a column of its own and validate_field_optionality() refuses
# either column on the wrong side — a marking nothing acts on is a defect this
# file does not let pass.
#
# A *response* field of a type no printf conversion writes — `any`, the one
# entry of that set — carries `hand_written = true`: a response field table
# holds the fields a conversion writes, and a command with a field none writes
# gets no table at all, so its reply is assembled by hand. The marking
# declares which replies those are, and the code that assembles one names the
# flag the generator emits for the command (scripts/proto_gen/emit_resp.py),
# so a marking that comes off the field is a compile error at that code. That
# is deliberate and it is the half no generator can check: which replies the
# firmware writes by hand is in the firmware, and the file it reads — this
# one's artifact — is where the declaration travels. What a generator can
# check, validate_field_hand_written() does: the column belongs to the
# response side, and the field under it is one no table carries — a marking on
# a field a table writes would be a flag asserting nothing about the code
# under it. The marking is not a licence to leave the field out of anything,
# and no emitter may take it as one.
# =============================================================================

# ---------------------------------------------------------------------------
# Meta
# ---------------------------------------------------------------------------
[meta]
name = "ThetaGP CDC JSON Protocol"
version = "1.3"
description = "CDC ACM JSON command protocol for ThetaGP embedded gamepad"

# ---------------------------------------------------------------------------
# Domains
# ---------------------------------------------------------------------------
[domains]
sys = "System commands (ping, reset, DFU)"
config = "Configuration commands"
test = "Test commands (flash/memory diagnostics)"
profile = "Profile commands (flash-backed profile management)"

# ---------------------------------------------------------------------------
# Global Error Codes
# ---------------------------------------------------------------------------
[error_codes]
ERR_NONE            = { code = 0,  description = "Success (internal only)" }
ERR_UNKNOWN_CMD     = { code = 1,  description = "Unknown command name" }
ERR_INVALID_PARAM   = { code = 2,  description = "Invalid parameter value" }
ERR_INTERNAL        = { code = 3,  description = "Device internal error" }
ERR_BUSY            = { code = 4,  description = "Device busy, retry later" }
ERR_NOT_SUPPORTED   = { code = 6,  description = "Command not supported in current state" }
ERR_BUFFER_OVERFLOW = { code = 7,  description = "Response too long to send" }
ERR_INVALID_STATE   = { code = 8,  description = "Command refused by the state the device is in" }

# ---------------------------------------------------------------------------
# Response Envelope
# ---------------------------------------------------------------------------
# The keys a successful reply carries in front of the fields a command declares
# for it. They belong to the response builder, not to a command: no command may
# declare one of these keys as a response field and validate_envelope() refuses
# one that does, naming command and field.
#
# Three things the firmware does not hold to, so a reply is read from the
# firmware's own sources rather than from this section:
#
#   * Not every reply carries all three keys, and the `appears` column below is
#     where that is declared per key. The dispatcher's two replies to a request
#     whose `cmd` or `queued` it could not read carry `status` alone of these,
#     with no `cmd` and no `queued`; the configuration domain's error helper
#     writes that same shape, and the `profile.end` trailer carries `cmd` and
#     `status` with no `queued`. A request carries `cmd` and `queued` and no
#     `status`, and the device refuses one missing either of the two.
#   * There is no one order. `status,cmd,queued` leads 20 of the firmware's 46
#     format strings, `cmd,queued,status` leads 22, the trailer above orders
#     `cmd,status`, and the three replies that carry none of `cmd`/`queued` --
#     the dispatcher's two and the configuration domain's error shape -- lead
#     with `status,error_code,reason`. Each emitter writes the order declared
#     here, so a consumer keys off the names and not the positions.
#   * `error_code` and `reason` are not declared here: they are the error
#     reply's, which [error_reply] below declares, and no emitter in this file
#     writes them from either section. A binding generated from this one does
#     not carry them.
#
# One entry per key: the TOML key is the field name a target writes it as, `json`
# is the key it travels under (gen_rust writes the TOML key where gen_ts writes
# the `json` column, so validate_envelope() holds the two equal), `type` is
# drawn from the same vocabulary a field's `type` is, `appears` says in which
# messages of each side the key shows up, and `description` is what a reader of
# a reply needs to know about it. gen_rust writes a response struct's leading
# fields and gen_ts a response interface's leading lines from this section, and
# now a request type's leading fields and lines too, so the shape of both
# messages starts in one place instead of in a literal per target. The
# firmware's format strings are still written by hand -- 46 of them across the
# five files that build a reply: the system, test, profile and configuration
# domains at 8, 12, 15 and 8, and the dispatcher at 3.
# Deriving them needs the generated response field tables extended to the
# envelope, which is a change of its own.
#
# `appears` is one column with one cell per side, and both cells take the same
# three words, because the question is the same on each side -- is the key in
# every message of this side, in some of them, or in none:
#
#   always — every message of that side carries the key
#   some   — some of them do and some do not. Which ones is the firmware's
#            business: it is evidence in the firmware's sources (see the first
#            above), not something this section states per key
#   never  — none of them does
#
# The two targets read the column instead of assuming a key is always there: a
# key of `always` is written required (`pub status: String` / `status: string`),
# one of `some` optional (`pub cmd: Option<String>` / `cmd?: string`), and one
# of `never` is not written for that side at all -- on whichever side it
# appears. That is why the column is here: without it every key is written
# required on both sides, and a binding that requires `cmd`/`queued` in a reply
# refuses to deserialize the error replies the device really sends
# (the dispatcher's two replies above), while a request type that writes `status`
# carries a key no request has. What the column does not say is the shape of a
# whole message: `some` on `cmd` and on `queued` does not state that the replies
# they are missing from are the same ones, and `error_code`/`reason` -- which
# the error replies carry and this section still does not declare -- stay
# outside it.
[envelope]
status = { type = "string", json = "status", appears = { request = "never",  reply = "always" }, description = "Outcome of the command: ok or error" }
cmd    = { type = "string", json = "cmd",    appears = { request = "always", reply = "some"   }, description = "Full name of the command this reply answers, e.g. sys.ping. A request carries the command being asked for under the same key, which is why the column says it appears on both sides" }
queued = { type = "u32",    json = "queued", appears = { request = "always", reply = "some"   }, description = "The request's queued value plus one, echoed so a host can pair a reply with its request. The accepted range is 0..2147483647: a literal wider than an int saturates at that bound rather than wrapping and is accepted as it stands, while a missing, negative or non-integer value is refused with error_code 2 and a reply that carries neither this key nor cmd. 38 of the 42 replies that carry this key echo the request's value plus one; the four staged profile.start replies echo a literal 0 instead" }

# ---------------------------------------------------------------------------
# Error Reply
# ---------------------------------------------------------------------------
# The keys an error reply carries behind `status`: the code for what went wrong,
# and the sentence saying it. They belong to the error reply builders -- a
# handler's sendError() and the dispatcher's own refusals -- and not to a
# command: no command may declare one of these keys as a response field, and
# validate_error_reply() refuses one that does, naming command and field, for
# the same reason validate_envelope() refuses a field under an envelope key.
#
# Three things about the shape, as the firmware writes it:
#
#   * The value of `error_code` is the `code` of one of the [error_codes]
#     entries above, written as a number rather than as a name (2 for
#     ERR_INVALID_PARAM, 1 for ERR_UNKNOWN_CMD). ERR_NONE's 0 is not one of
#     them, so the key appears only in a reply whose status is error -- and it
#     is never written without `reason` beside it. Which numbers a command's
#     reply can carry is the `error_codes` array that command declares; this is
#     the key they arrive in.
#   * `reason` is written without `error_code` in two replies: the staged
#     profile.start refusals report a failed write as a sentence with no code.
#     Both keys are of `some` on the reply side for the plainer reason as well,
#     that a reply of any other status carries neither.
#   * No emitter in this file writes either key or emits a field for one: the
#     firmware writes them by hand in 13 and 15 of its 46 format strings
#     respectively -- the system and test domains at 3 and 4 each, the profile
#     domain at 2 and 4, the configuration domain at 1 each, and the dispatcher
#     at 3 each. Deriving those format strings needs the generated response
#     field tables extended to these keys, which is a change of its own; what
#     this section states meanwhile is the contract, so a host reads the keys,
#     their types and where they appear from here rather than out of those
#     format strings.
#
# One entry per key, with the columns [envelope] gives its keys: the TOML key is
# the name a target would write such a field as, `json` is the key it travels
# under, `type` is drawn from the same vocabulary a field's `type` is, `appears`
# says in which messages of each side the key shows up, and `description` is
# what a reader of a reply needs to know about it. `appears` takes the same
# three words [envelope] documents -- `always`, `some`, `never` -- because the
# question is the same on each side, and the section's validator reads the same
# vocabulary. Both keys are `request = "never"` and are not reserved there: a
# request carries no code and no sentence, so no request type writes a line for
# one.
#
# What the section does not state is whether these are the keys and the shape
# the firmware's format strings write. Those copies are still written by hand,
# so comparing them is a review and a device-side check, not something this file
# can read.

[error_reply]
error_code = { type = "i32",    json = "error_code", appears = { request = "never", reply = "some" }, description = "Numeric code for what went wrong: the `code` of one of the [error_codes] entries above, written as a number rather than as a name (2 for ERR_INVALID_PARAM, 1 for ERR_UNKNOWN_CMD, and so on). It is not a status of its own: a reply that succeeded says so in `status` and carries neither this key nor `reason`, so the key appears only where the status is error, and always with `reason` beside it. Which of the numbers a command's reply can carry is the `error_codes` array that command declares; this is the key they arrive in" }
reason     = { type = "string", json = "reason",     appears = { request = "never", reply = "some" }, description = "What was wrong with the request, in words: the sentence the firmware logs beside the code, and the only key that separates two failures sharing one code (test.flash_read's invalid length and the dispatcher's unknown command are both error_code 1). Written in 15 of the firmware's format strings: with `error_code` in each of the 13 that carry one, and alone in the two staged profile.start refusals that report a failed write with no code. Its text is the firmware's, not a value declared here: a host switches on `error_code` and shows this to a reader, so the two are not to be read as one key in two spellings" }

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Type definitions
# ---------------------------------------------------------------------------

[[types]]
name = "FirmwareInfo"
namespace = "ThetaGP"
description = "Device firmware version information"
fields = [
  { name = "board",      type = "string", json = "board",      description = "Name of the board the firmware was built for, as that build declares it" },
  { name = "version",    type = "string", json = "version",    description = "Semantic version string" },
  { name = "build_date", type = "string", json = "build_date", description = "Build date" },
  { name = "build_time", type = "string", json = "build_time", description = "Build time" },
]

# ===========================================================================
# Commands
# ===========================================================================

# --- sys domain ---

[[commands]]
name = "ping"
domain = "sys"
description = "Connectivity health check"
request = []
response = []
error_codes = []

[[commands]]
name = "get_fw_version"
domain = "sys"
description = "Read firmware version and build info"
request = []
response = [
  { name = "board",      type = "string", json = "board" },
  { name = "version",    type = "string", json = "version" },
  { name = "build_date", type = "string", json = "build_date" },
  { name = "build_time", type = "string", json = "build_time" },
]
error_codes = []

[[commands]]
name = "reset"
domain = "sys"
description = "Trigger NVIC system reset"
request = []
response = []
error_codes = []

[[commands]]
name = "enter_dfu"
domain = "sys"
description = "Enter DFU bootloader mode"
request = []
response = []
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "DFU not yet implemented" },
]

[[commands]]
name = "get_task_info"
domain = "sys"
description = "Get task scheduler statistics by TID"
request = [
  { name = "tid", type = "i32", json = "tid", required = false, default = 0 },
]
response = [
  { name = "tid",       type = "i32",   json = "tid" },
  { name = "name",      type = "string", json = "name" },
  { name = "sub",       type = "string", json = "sub" },
  { name = "desiredUs",   type = "u32",   json = "desiredUs", role = "accounting" },
  { name = "avgCycleUs",  type = "u32",   json = "avgCycleUs", role = "accounting" },
  { name = "actualHz",    type = "u32",   json = "actualHz", role = "accounting" },
  { name = "maxExecUs",   type = "u32",   json = "maxExecUs", role = "accounting" },
  { name = "avgExecUs",   type = "u32",   json = "avgExecUs", description = "Moving-average execution time, microseconds", role = "accounting" },
  { name = "totalExecUs", type = "u32",   json = "totalExecUs", description = "Accumulated execution time since boot, microseconds", role = "accounting" },
  { name = "avgDeltaUs",  type = "u32",   json = "avgDeltaUs", description = "Moving-average interval between executions, microseconds", role = "accounting" },
  { name = "runCount",    type = "u32",   json = "runCount", description = "Times the task function has run, reported only in a build with the test API", role = "task_counters" },
  { name = "lateCount",   type = "u32",   json = "lateCount", description = "Times the task missed its deadline, reported only in a build with the test API", role = "task_counters" },
]
error_codes = [
  { name = "ERR_INVALID_PARAM", code = 2, description = "Invalid TID" },
]

[[commands]]
name = "get_usage"
domain = "sys"
description = "Aggregate resource usage: CPU load, MCU flash, MCU RAM, external SPI flash"
request = []
response = [
  { name = "cpu_load_percent",       type = "u32", json = "cpu_load_percent" },
  { name = "task_count",             type = "u32", json = "task_count" },
  { name = "mcu_flash_used_bytes",   type = "u32", json = "mcu_flash_used_bytes" },
  { name = "mcu_flash_total_bytes",  type = "u32", json = "mcu_flash_total_bytes" },
  { name = "ram_used_bytes",         type = "u32", json = "ram_used_bytes" },
  { name = "ram_total_bytes",        type = "u32", json = "ram_total_bytes" },
  { name = "ram_reserved_bytes",     type = "u32", json = "ram_reserved_bytes" },
  { name = "ext_flash_total_sectors", type = "u32", json = "ext_flash_total_sectors" },
  { name = "ext_flash_used_sectors", type = "u32", json = "ext_flash_used_sectors" },
  { name = "ext_flash_free_sectors", type = "u32", json = "ext_flash_free_sectors" },
  { name = "ext_flash_reserved_sectors", type = "u32", json = "ext_flash_reserved_sectors" },
  { name = "profile_count",          type = "u32", json = "profile_count" },
  { name = "region_count", type = "u32", json = "region_count", description = "Number of entries in the regions array" },
  { name = "regions", type = "any", json = "regions", description = "Array of one object per memory region the firmware reports; each object's wire keys are `name` (the region name), `size` (its capacity in bytes), `used` (the bytes in use) and `reserved` (the part of `used` a fixed reserve already holds). Which regions those are, how many there are and the order they come in is the firmware's answer and not a list written here, so a board with fewer or differently named regions answers this command without the command naming one; the declared type is `any` because the type vocabulary carries no array-of-object type, and the field is `hand_written` because no printf conversion writes a value of that type: this reply is assembled by hand and the site that assembles it asserts the flag the marking emits", hand_written = true },
]
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "The region list is longer than the reply buffer, so it is refused rather than sent cut short" },
]

# --- config domain ---

[[commands]]
name = "set_key"
domain = "config"
description = "Write one key of the configuration the device is running: a scalar key takes a number and an array key exactly as many elements as the key holds, and the write reaches the configuration in effect, not the storage (`config.save` is what writes that out). A key the table does not carry, a value the key does not accept and a request whose value is missing are all refused with ERR_INVALID_PARAM (2); an array value is checked element by element before the first byte is written, so a refused write leaves the key as it was."
request = [
  { name = "key",   type = "string", json = "key",   required = true },
  { name = "value", type = "any",    json = "value", required = true },
]
response = [
  { name = "key", type = "string", json = "key" },
]
error_codes = [
  { name = "ERR_INVALID_PARAM", code = 2, description = "Invalid key or value" },
]

[[commands]]
name = "get_key"
domain = "config"
description = "Read one key of the configuration the device is running back: a scalar key reads back as a number and an array key as a JSON array of numbers in element order. A key the table does not carry is refused with ERR_INVALID_PARAM (2), and a value whose rendered form does not fit the reply buffer is refused with ERR_NOT_SUPPORTED (6) rather than sent cut short."
request = [
  { name = "key", type = "string", json = "key", required = true },
]
response = [
  { name = "key",   type = "string", json = "key" },
  { name = "value", type = "any",    json = "value", description = "The value the key holds: one number for a scalar key and an array of numbers for an array key, in element order. A key's JSON type is not known here, and no printf conversion writes a value of unknown type, so the field is `hand_written`: this reply is assembled by hand and the site that assembles it asserts the flag the marking emits", hand_written = true },
]
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "The rendered value does not fit the reply buffer, so it is refused rather than sent cut short" },
  { name = "ERR_INVALID_PARAM", code = 2, description = "Missing or unknown key" },
]

[[commands]]
name = "list_keys"
domain = "config"
description = "List the configuration keys this firmware supports, with each key's range and whether it needs a reboot"
request = []
response = [
  { name = "count", type = "u32", json = "count", description = "Number of entries in the keys array" },
  { name = "keys",  type = "any", json = "keys",  description = "Array of one object per supported key; each object's wire keys are `key` (the key name), `min` and `max` (its accepted range) and `reboot` (whether the key needs a reboot to take effect). The entries come from the firmware's key table, not from a list written here, and the declared type is `any` because the type vocabulary carries no array-of-object type, and the field is `hand_written` because no printf conversion writes a value of that type: this reply is assembled by hand and the site that assembles it asserts the flag the marking emits", hand_written = true },
]
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "The key list is longer than the reply buffer" },
]

[[commands]]
name = "save"
domain = "config"
description = "Write the configuration in effect to the profile it belongs to (the active one): a board with a storage chip answers `persisted` true for a write that reached the flash, or refuses with ERR_INVALID_STATE (8) -- naming either the factory profile (id 0, which the write refuses rather than attempts) or a write that failed. A board with no storage chip answers `ok` with `persisted` false: the values are in effect, and the reply says they will not survive a power cycle."
request = []
response = [
  { name = "persisted", type = "bool", json = "persisted", description = "Whether the configuration was written to the device's persistent storage; false on a board that has none, where the values are in effect but will not survive a power cycle" },
  { name = "dropped_keys", type = "u32", json = "dropped_keys", optional = true, description = "How many object keys of the body this save replaced the body it wrote does not carry. Written only when that number is not zero, so a save that carried every key over answers exactly as this command always has. Raised only by a write that reached the flash, and left out when the body being replaced could not be read back, because the number is unknown then" },
]
error_codes = [
  { name = "ERR_INVALID_STATE", code = 8, description = "The active profile is the factory one, or the write to it failed" },
]

[[commands]]
name = "load"
domain = "config"
description = "Read the profile the configuration in effect belongs to (the active one) back over it, starting from the compiled-in defaults; the active profile id is never changed. A board with no storage chip is refused with ERR_NOT_SUPPORTED (6), naming the missing facility rather than a read that failed, and a profile whose body cannot be read is refused with ERR_INVALID_PARAM (2)."
request = []
response = []
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "No persistent storage on this board" },
  { name = "ERR_INVALID_PARAM", code = 2, description = "The active profile could not be read" },
]

[[commands]]
name = "factory_reset"
domain = "config"
description = "Replace the configuration in effect with the compiled-in defaults, writing nothing to persistent storage: writing it out is `config.save`'s job, so the reply answers `ok` with `persisted` always false."
request = []
response = [
  { name = "persisted", type = "bool", json = "persisted", description = "Whether the configuration left in effect by the reset was written to the device's persistent storage; false on a board that has none. The reset replaces the in-effect configuration; writing it out is config.save's job" },
]
error_codes = []
