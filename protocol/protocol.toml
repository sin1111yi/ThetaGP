# =============================================================================
# ThetaGP CDC JSON Protocol Definition
# =============================================================================
# This file is the SINGLE SOURCE OF TRUTH for all CDC JSON protocol types,
# commands, constants, and error codes. The Python code generator
# (scripts/gen_proto.py) reads this file and produces:
#   - C++   headers (protocol/proto.h)   — device side
#   - Rust  types   (protocol/proto.rs)   — Tauri backend
#   - TS    types   (protocol/types.ts)   — frontend
#
# Format overview:
#   [meta]            — project metadata
#   [[types]]         — shared data structures (structs)
#   [[enums]]         — enumeration types
#   [[commands]]      — per-command definitions
#   [error_codes]     — global error codes
#   [domains]         — domain prefix registry
#   [envelope]        — response envelope (the keys a reply and a request
#                       carry, and how completely each side carries them)
#   [[async_messages]] — device-initiated async message definitions
#
# A field of a command may carry a `role`, a property of the field that outlives
# its type and its position. The generator turns each role into an expectation
# the consumers of this file hold:
#   accounting    — the field is part of the per-task accounting subset the CDC
#                   test suite requires in every build
#                   (scripts/test/test_cdc_protocol.py)
#   task_counters — the field is written to a response only in a build that
#                   compiles the task counters in (USE_TASK_COUNTERS)
# =============================================================================

# ---------------------------------------------------------------------------
# Meta
# ---------------------------------------------------------------------------
[meta]
name = "ThetaGP CDC JSON Protocol"
version = "1.2"
description = "CDC ACM JSON command protocol for ThetaGP embedded gamepad"

# ---------------------------------------------------------------------------
# Domains
# ---------------------------------------------------------------------------
[domains]
sys = "System commands (ping, reset, DFU)"
config = "Configuration commands"
test = "Test commands (flash/memory diagnostics)"
profile = "Profile commands (flash-backed profile management)"

# ---------------------------------------------------------------------------
# Global Error Codes
# ---------------------------------------------------------------------------
[error_codes]
ERR_NONE            = { code = 0,  description = "Success (internal only)" }
ERR_UNKNOWN_CMD     = { code = 1,  description = "Unknown command name" }
ERR_INVALID_PARAM   = { code = 2,  description = "Invalid parameter value" }
ERR_INTERNAL        = { code = 3,  description = "Device internal error" }
ERR_BUSY            = { code = 4,  description = "Device busy, retry later" }
ERR_NOT_SUPPORTED   = { code = 6,  description = "Command not supported in current state" }
ERR_BUFFER_OVERFLOW = { code = 7,  description = "Response too long to send" }
ERR_INVALID_STATE   = { code = 8,  description = "Command refused by the state the device is in" }

# ---------------------------------------------------------------------------
# Response Envelope
# ---------------------------------------------------------------------------
# The keys a successful reply carries in front of the fields a command declares
# for it. They belong to the response builder, not to a command: no command may
# declare one of these keys as a response field and validate_envelope() refuses
# one that does, naming command and field.
#
# Three things the firmware does not hold to, so a reply is read from the
# sources under src/test/ rather than from this section:
#
#   * Not every reply carries all three keys, and the `appears` column below is
#     where that is declared per key. The dispatcher's two replies to a request
#     whose `cmd` or `queued` it could not read carry `status` alone of these,
#     with no `cmd` and no `queued` (src/test/dispatcher.cpp:55, :75), and the
#     `profile.end` trailer carries `cmd` and `status` with no `queued`
#     (src/test/profile_cmd_handler.cpp:246). A request carries `cmd` and
#     `queued` and no `status`, and the device refuses one missing either of the
#     two (src/test/dispatcher.cpp:70-80).
#   * There is no one order. `status,cmd,queued` leads 20 of the firmware's 38
#     format strings, `cmd,queued,status` leads 15, and the trailer above orders
#     `cmd,status`. Each emitter writes the order declared here, so a consumer
#     keys off the names and not the positions.
#   * `error_code` and `reason` are declared nowhere in this file, and no
#     emitter here writes them: the firmware writes them by hand in 11 and 12
#     of its format strings respectively. A binding generated from this section
#     does not carry them.
#
# One entry per key: the TOML key is the field name a target writes it as, `json`
# is the key it travels under (gen_rust writes the TOML key where gen_ts writes
# the `json` column, so validate_envelope() holds the two equal), `type` is
# drawn from the same vocabulary a field's `type` is, `appears` says in which
# messages of each side the key shows up, and `description` is what a reader of
# a reply needs to know about it. gen_rust writes a response struct's leading
# fields and gen_ts a response interface's leading lines from this section, and
# now a request type's leading fields and lines too, so the shape of both
# messages starts in one place instead of in a literal per target. The
# firmware's format strings are still written by hand -- 38 of them across four
# files: src/test/testsys.cpp (8), src/test/testcmds.cpp (12),
# src/test/profile_cmd_handler.cpp (15) and src/test/dispatcher.cpp (3).
# Deriving them needs the response field table mechanism (proto_resp.h)
# extended to the envelope, which is a change of its own.
#
# `appears` is one column with one cell per side, and both cells take the same
# three words, because the question is the same on each side -- is the key in
# every message of this side, in some of them, or in none:
#
#   always — every message of that side carries the key
#   some   — some of them do and some do not. Which ones is the firmware's
#            business: it is evidence under src/test/ (see the first bullet
#            above), not something this section states per key
#   never  — none of them does
#
# The two targets read the column instead of assuming a key is always there: a
# key of `always` is written required (`pub status: String` / `status: string`),
# one of `some` optional (`pub cmd: Option<String>` / `cmd?: string`), and one
# of `never` is not written for that side at all -- on whichever side it
# appears. That is why the column is here: without it every key is written
# required on both sides, and a binding that requires `cmd`/`queued` in a reply
# refuses to deserialize the error replies the device really sends
# (src/test/dispatcher.cpp:55, :75), while a request type that writes `status`
# carries a key no request has. What the column does not say is the shape of a
# whole message: `some` on `cmd` and on `queued` does not state that the replies
# they are missing from are the same ones, and `error_code`/`reason` -- which
# the error replies carry and this section still does not declare -- stay
# outside it.
[envelope]
status = { type = "string", json = "status", appears = { request = "never",  reply = "always" }, description = "Outcome of the command: ok or error" }
cmd    = { type = "string", json = "cmd",    appears = { request = "always", reply = "some"   }, description = "Full name of the command this reply answers, e.g. sys.ping. A request carries the command being asked for under the same key, which is why the column says it appears on both sides" }
queued = { type = "u32",    json = "queued", appears = { request = "always", reply = "some"   }, description = "The request's queued value plus one, echoed so a host can pair a reply with its request. The accepted range is 0..2147483647: a literal wider than an int saturates at that bound rather than wrapping (src/utils/json/json.cpp:13-36) and is accepted as it stands, while a missing, negative or non-integer value is refused with error_code 2 and a reply that carries neither this key nor cmd (src/test/dispatcher.cpp:70-80). 31 of the 35 replies that carry this key echo the request's value plus one; the four staged profile.start replies echo a literal 0 instead (src/test/profile_cmd_handler.cpp:146,153,158,165)" }

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Type definitions
# ---------------------------------------------------------------------------

[[types]]
name = "GamepadRawInput"
namespace = "ThetaGP::Gamepad"
description = "Gamepad raw input state (buttons + dpad + analog sticks + triggers)"
codebase_owned = true
fields = [
  { name = "buttons",       type = "u32", json = "buttons",       description = "32-bit button mask" },
  { name = "dpad",          type = "u8",  json = "dpad",          description = "D-pad 4-bit value (0-15)" },
  { name = "dpadOriginal", type = "u8",  json = "dpad_original", description = "Original d-pad before SOCD cleaning" },
  { name = "aux",           type = "u16", json = "aux",           description = "AUX state (function button etc.)" },
  { name = "lx",            type = "u16", json = "lx",            description = "Left stick X (0-65535)" },
  { name = "ly",            type = "u16", json = "ly",            description = "Left stick Y (0-65535)" },
  { name = "rx",            type = "u16", json = "rx",            description = "Right stick X (0-65535)" },
  { name = "ry",            type = "u16", json = "ry",            description = "Right stick Y (0-65535)" },
  { name = "lt",            type = "u8",  json = "lt",            description = "Left trigger (0-255)" },
  { name = "rt",            type = "u8",  json = "rt",            description = "Right trigger (0-255)" },
]

[[types]]
name = "HIDReport"
namespace = "ThetaGP"
description = "HID gamepad report sent over USB (8-bit analog, 4-bit hat switch)"
codebase_owned = true
fields = [
  { name = "buttons",   type = "u32", json = "buttons",   description = "32-bit button mask" },
  { name = "direction", type = "u8",  json = "dpad",      description = "HAT switch value (8=center, bitfield in actual HIDReport struct)" },
  { name = "dummy",     type = "u8",  json = "",           description = "Padding bits (4-bit), internal", omit_in_serialize = true },
  { name = "l_x_axis",  type = "u8",  json = "l_x_axis",  description = "Left stick X (0-255)" },
  { name = "l_y_axis",  type = "u8",  json = "l_y_axis",  description = "Left stick Y (0-255)" },
  { name = "r_x_axis",  type = "u8",  json = "r_x_axis",  description = "Right stick X (0-255)" },
  { name = "r_y_axis",  type = "u8",  json = "r_y_axis",  description = "Right stick Y (0-255)" },
]

[[types]]
name = "FirmwareInfo"
namespace = "ThetaGP"
description = "Device firmware version information"
fields = [
  { name = "board",      type = "string", json = "board",      description = "Board name (e.g. BoringTechH743)" },
  { name = "version",    type = "string", json = "version",    description = "Semantic version string" },
  { name = "build_date", type = "string", json = "build_date", description = "Build date" },
  { name = "build_time", type = "string", json = "build_time", description = "Build time" },
]

# ===========================================================================
# Commands
# ===========================================================================

# --- sys domain ---

[[commands]]
name = "ping"
domain = "sys"
description = "Connectivity health check"
request = []
response = []
error_codes = []

[[commands]]
name = "get_fw_version"
domain = "sys"
description = "Read firmware version and build info"
request = []
response = [
  { name = "board",      type = "string", json = "board" },
  { name = "version",    type = "string", json = "version" },
  { name = "build_date", type = "string", json = "build_date" },
  { name = "build_time", type = "string", json = "build_time" },
]
error_codes = []

[[commands]]
name = "reset"
domain = "sys"
description = "Trigger NVIC system reset"
request = []
response = []
error_codes = []

[[commands]]
name = "enter_dfu"
domain = "sys"
description = "Enter DFU bootloader mode"
request = []
response = []
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "DFU not yet implemented" },
]

[[commands]]
name = "get_task_info"
domain = "sys"
description = "Get task scheduler statistics by TID"
request = [
  { name = "tid", type = "i32", json = "tid", required = false, default = 0 },
]
response = [
  { name = "tid",       type = "i32",   json = "tid" },
  { name = "name",      type = "string", json = "name" },
  { name = "sub",       type = "string", json = "sub" },
  { name = "desiredUs",   type = "u32",   json = "desiredUs", role = "accounting" },
  { name = "avgCycleUs",  type = "u32",   json = "avgCycleUs", role = "accounting" },
  { name = "actualHz",    type = "u32",   json = "actualHz", role = "accounting" },
  { name = "maxExecUs",   type = "u32",   json = "maxExecUs", role = "accounting" },
  { name = "avgExecUs",   type = "u32",   json = "avgExecUs", description = "Moving-average execution time, microseconds", role = "accounting" },
  { name = "totalExecUs", type = "u32",   json = "totalExecUs", description = "Accumulated execution time since boot, microseconds", role = "accounting" },
  { name = "avgDeltaUs",  type = "u32",   json = "avgDeltaUs", description = "Moving-average interval between executions, microseconds", role = "accounting" },
  { name = "runCount",    type = "u32",   json = "runCount", description = "Times the task function has run, reported only in a build with the test API (testsys.cpp:128)", role = "task_counters" },
  { name = "lateCount",   type = "u32",   json = "lateCount", description = "Times the task missed its deadline, reported only in a build with the test API (testsys.cpp:128)", role = "task_counters" },
]
error_codes = [
  { name = "ERR_INVALID_PARAM", code = 2, description = "Invalid TID" },
]

[[commands]]
name = "get_usage"
domain = "sys"
description = "Aggregate resource usage: CPU load, MCU flash, MCU RAM, external SPI flash"
request = []
response = [
  { name = "cpu_load_percent",       type = "u32", json = "cpu_load_percent" },
  { name = "task_count",             type = "u32", json = "task_count" },
  { name = "mcu_flash_used_bytes",   type = "u32", json = "mcu_flash_used_bytes" },
  { name = "mcu_flash_total_bytes",  type = "u32", json = "mcu_flash_total_bytes" },
  { name = "ram_used_bytes",         type = "u32", json = "ram_used_bytes" },
  { name = "ram_total_bytes",        type = "u32", json = "ram_total_bytes" },
  { name = "ram_reserved_bytes",     type = "u32", json = "ram_reserved_bytes" },
  { name = "ram_dtcm_used_bytes",    type = "u32", json = "ram_dtcm_used_bytes" },
  { name = "ram_axi_used_bytes",     type = "u32", json = "ram_axi_used_bytes" },
  { name = "ram_d2_used_bytes",      type = "u32", json = "ram_d2_used_bytes" },
  { name = "ram_d3_used_bytes",      type = "u32", json = "ram_d3_used_bytes" },
  { name = "ram_itcm_used_bytes",    type = "u32", json = "ram_itcm_used_bytes" },
  { name = "ext_flash_total_sectors", type = "u32", json = "ext_flash_total_sectors" },
  { name = "ext_flash_used_sectors", type = "u32", json = "ext_flash_used_sectors" },
  { name = "ext_flash_free_sectors", type = "u32", json = "ext_flash_free_sectors" },
  { name = "ext_flash_reserved_sectors", type = "u32", json = "ext_flash_reserved_sectors" },
  { name = "profile_count",          type = "u32", json = "profile_count" },
]
error_codes = []

# --- config domain (reserved) ---

[[commands]]
name = "set_key"
domain = "config"
description = "Set a configuration key-value pair (reserved)"
request = [
  { name = "key",   type = "string", json = "key",   required = true },
  { name = "value", type = "any",    json = "value", required = true },
]
response = [
  { name = "key", type = "string", json = "key" },
]
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "Not yet implemented" },
  { name = "ERR_INVALID_PARAM", code = 2, description = "Invalid key or value" },
]

[[commands]]
name = "get_key"
domain = "config"
description = "Get a configuration key value (reserved)"
request = [
  { name = "key", type = "string", json = "key", required = true },
]
response = [
  { name = "key",   type = "string", json = "key" },
  { name = "value", type = "any",    json = "value" },
]
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "The value is longer than the reply buffer" },
  { name = "ERR_INVALID_PARAM", code = 2, description = "Unknown key" },
]

[[commands]]
name = "list_keys"
domain = "config"
description = "List the configuration keys this firmware supports, with each key's range and whether it needs a reboot"
request = []
response = [
  { name = "count", type = "u32", json = "count", description = "Number of entries in the keys array" },
  { name = "keys",  type = "any", json = "keys",  description = "Array of one object per supported key; each object's wire keys are `key` (the key name), `min` and `max` (its accepted range) and `reboot` (whether the key needs a reboot to take effect). The entries come from the firmware's key table, not from a list written here, and the declared type is `any` because the type vocabulary carries no array-of-object type" },
]
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "The key list is longer than the reply buffer" },
]

[[commands]]
name = "save"
domain = "config"
description = "Save configuration to persistent storage (reserved)"
request = []
response = [
  { name = "persisted", type = "bool", json = "persisted", description = "Whether the configuration was written to the device's persistent storage; false on a board that has none, where the values are in effect but will not survive a power cycle" },
]
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "No persistent storage on this board" },
  { name = "ERR_INVALID_STATE", code = 8, description = "The active profile is the factory one, or the write to it failed" },
]

[[commands]]
name = "load"
domain = "config"
description = "Load configuration from persistent storage (reserved)"
request = []
response = []
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "No persistent storage on this board" },
  { name = "ERR_INVALID_PARAM", code = 2, description = "The active profile could not be read" },
]

[[commands]]
name = "factory_reset"
domain = "config"
description = "Restore factory defaults and save (reserved)"
request = []
response = [
  { name = "persisted", type = "bool", json = "persisted", description = "Whether the configuration left in effect by the reset was written to the device's persistent storage; false on a board that has none. The reset replaces the in-effect configuration; writing it out is config.save's job" },
]
error_codes = [
  { name = "ERR_NOT_SUPPORTED", code = 6, description = "Not yet implemented" },
]
